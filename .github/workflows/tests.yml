# The Lean tests (tests/) against the native build of the same C++ the guests compile, and the
# offline root's seed store on each OS. The riscv64 guest build needs the org's sysroot and runs on
# a desk; see README.md.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools from apt
        run: sudo apt-get update -q && sudo apt-get install -y -q clang cmake ninja-build libc++-18-dev libc++abi-18-dev libgmp-dev libuv1-dev
      - name: Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and run the tests
        working-directory: tests
        # The zone's C++ uses libstdc++, and SQLite needs a newer glibc than Lean's bundled clang
        # links against, so the tests link with the system compiler and the system's crt and libraries.
        # libleancpp is built against the libc++ that ships in the toolchain's lib/, so that comes first.
        run: |
          export LEAN_CC=cc LIBRARY_PATH="$(lean --print-prefix)/lib:/usr/lib/llvm-18/lib"
          lake build && .lake/build/bin/tests
  offline-ca-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-make
      - name: MinGW on PATH
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: fz_offline_ca and fz_seal build; RFC 9180 and the store's refusals on software keys
        run: elixir tools/offline_ca.exs --self-test
      - name: DPAPI, the TPM where the runner has one, and adopt from a throwaway generic credential
        run: elixir tools/offline_ca.exs --os-check
  offline-ca-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: RFC 9180 and the store's refusals on software keys
        run: elixir tools/offline_ca.exs --self-test
      - name: The systemd-creds store refuses below systemd 256 and writes nothing
        run: elixir tools/offline_ca.exs --os-check
  offline-ca-macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Elixir from Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install elixir
      - name: fz_offline_ca and fz_seal build; RFC 9180 and the store's refusals on software keys
        run: elixir tools/offline_ca.exs --self-test
      - name: The Secure Enclave probe, and adopt's read from a throwaway keychain
        run: elixir tools/offline_ca.exs --os-check
